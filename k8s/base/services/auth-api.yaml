apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: joseph-dev
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: auth-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: joseph-dev
spec:
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
        - name: auth-api
          image: ghcr.io/CHANGEME/joseph-auth-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=$(SA_PASSWORD);TrustServerCertificate=True;"
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SA_PASSWORD
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JwtSettings__SecretKey
            - name: JwtSettings__Issuer
              value: "https://auth.joseph.com"
            - name: JwtSettings__Audience
              value: "https://api.joseph.com"
            - name: JwtSettings__ExpirationMinutes
              value: "1440"
            - name: Logging__SeqUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: Logging__SeqUrl
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
