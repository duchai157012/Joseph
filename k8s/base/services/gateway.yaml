apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: joseph-dev
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: joseph-dev
spec:
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/CHANGEME/joseph-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ReverseProxy__Clusters__catalog__Destinations__destination1__Address
              value: "http://catalog-api:80"
            - name: ReverseProxy__Clusters__ordering__Destinations__destination1__Address
              value: "http://order-api:80"
            - name: ReverseProxy__Clusters__auth__Destinations__destination1__Address
              value: "http://auth-api:80"
          resources:
            limits:
              memory: 256Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
