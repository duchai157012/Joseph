apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: joseph-dev
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: order-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: joseph-dev
spec:
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: ghcr.io/CHANGEME/joseph-order-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=$(SA_PASSWORD);TrustServerCertificate=True;"
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SA_PASSWORD
            - name: RabbitMq__Host
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: RabbitMq__Host
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RabbitMq__Username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RabbitMq__Password
            - name: Services__CatalogApi__BaseUrl
              value: "http://catalog-api:80"
            - name: Logging__SeqUrl
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: Logging__SeqUrl
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
