kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: joseph-cluster
nodes:
  # Control plane node with ingress enabled
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # Gateway service (alternative to ingress)
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Argo CD UI
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
      # Argo Workflows UI
      - containerPort: 30746
        hostPort: 2746
        protocol: TCP
    extraMounts:
      # Mount for SQL Server data persistence
      - hostPath: ./kind-volumes/sqlserver
        containerPath: /mnt/sqlserver
  
  # Worker node 1
  - role: worker
    extraMounts:
      # Mount for general persistent volumes
      - hostPath: ./kind-volumes/data
        containerPath: /mnt/data
